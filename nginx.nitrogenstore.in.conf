server {
    listen 80;
    server_name nitrogenstore.in www.nitrogenstore.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nitrogenstore.in www.nitrogenstore.in;

    ssl_certificate     /etc/letsencrypt/live/nitrogenstore.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nitrogenstore.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-Frame-Options            "DENY" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()" always;

    # Frontend — React build
    root /var/www/nitrogenstore/frontend/dist;
    index index.html;

    # Upload files served by backend
    location /uploads/ {
        proxy_pass http://localhost:5002/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API — Node.js backend
    location /api/ {
        proxy_pass http://localhost:5002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # React SPA — all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 10M;
}
