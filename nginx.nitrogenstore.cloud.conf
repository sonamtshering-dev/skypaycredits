server {
    listen 80;
    server_name nitrogenstore.cloud www.nitrogenstore.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nitrogenstore.cloud www.nitrogenstore.cloud;

    ssl_certificate     /etc/letsencrypt/live/nitrogenstore.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nitrogenstore.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Replace this block with your old site config ──
    root /var/www/nitrogenstore-cloud;
    index index.html index.php;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # ─────────────────────────────────────────────────

    client_max_body_size 10M;
}
